<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta name="description" content="Verdano City – Silvester Countdown 2026 zu 2027.">
<title>Verdano City — Silvester 2026/27</title>
<style>
:root {
  color-scheme: dark;
  --bg:#07070b;
  --bg2:#11070b;
  --red:#ff3051;
  --red2:#ff6a7f;
  --white:#fff6f7;
  --muted:#c2b8bf;
  --line:rgba(255,255,255,.14);
  --line-soft:rgba(255,255,255,.08);
  --pad:clamp(18px,4.8vw,84px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:Inter,"Segoe UI",Arial,Helvetica,sans-serif;background:#08080b;color:var(--white);-webkit-font-smoothing:antialiased}
.app{height:100vh;height:100dvh;overflow:hidden;position:relative;isolation:isolate;display:flex;flex-direction:column;background:
  radial-gradient(ellipse 52% 44% at 50% 38%, rgba(170,16,43,.26), transparent 72%),
  radial-gradient(ellipse 34% 28% at 78% 20%, rgba(255,51,83,.12), transparent 72%),
  radial-gradient(ellipse 28% 26% at 20% 74%, rgba(142,12,36,.08), transparent 72%),
  linear-gradient(180deg,#09090c 0%, #09080b 48%, #050508 100%);
}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 44%, rgba(0,0,0,.44) 100%);z-index:-1}
.frame{width:100%;max-width:1760px;margin:0 auto;padding-inline:var(--pad)}
#fireworks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.stage-glow{position:absolute;left:50%;top:5%;transform:translateX(-50%);width:min(66vw,1020px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,70,96,.10);box-shadow:0 0 120px rgba(255,40,70,.10),inset 0 0 60px rgba(255,60,88,.05);opacity:.95;animation:breath 8s ease-in-out infinite;z-index:0}
.stage-glow::before,.stage-glow::after{content:"";position:absolute;border-radius:50%;inset:11%;border:1px solid rgba(255,94,119,.08)}
.stage-glow::after{inset:25%;border-style:dashed;opacity:.55;animation:spin 38s linear infinite}
.light-sweep{position:absolute;left:18%;top:-30%;width:44%;height:130%;transform:rotate(22deg);background:linear-gradient(90deg, transparent 34%, rgba(255,48,81,.08) 50%, transparent 66%);animation:sweep 13s ease-in-out infinite;pointer-events:none;z-index:0}
.edge-frame{position:absolute;inset:14px;border:1px solid rgba(255,255,255,.06);pointer-events:none;z-index:2}
.header{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:18px;padding-block:clamp(13px,2.2vh,24px);border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:clamp(12px,1.8vw,20px);min-width:0}
.brand-mark{width:clamp(58px,6vw,94px);height:clamp(50px,5.2vw,82px);object-fit:contain;filter:drop-shadow(0 0 18px rgba(255,45,77,.34));flex:0 0 auto;animation:float 5s ease-in-out infinite}
.brand-copy{min-width:0}
.brand-title{font-size:clamp(14px,1.45vw,22px);font-weight:950;letter-spacing:.18em;line-height:1.08;white-space:nowrap}
.brand-meta{font-size:clamp(9px,.82vw,12px);color:#aaa0a7;font-weight:850;letter-spacing:.23em;margin-top:6px;white-space:nowrap}
.header-note{display:flex;align-items:center;gap:12px;font-size:clamp(10px,.9vw,14px);font-weight:850;letter-spacing:.20em;color:#cfc5cb;white-space:nowrap;text-transform:uppercase}
.header-note::before{content:"";width:34px;height:2px;background:linear-gradient(90deg,var(--red),transparent);box-shadow:0 0 16px rgba(255,48,81,.55)}
.main{position:relative;z-index:4;flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding-block:clamp(4px,1.2vh,10px);transform:translateY(-18px)}
.hero{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.kicker{display:inline-flex;align-items:center;gap:12px;font-size:clamp(10px,1.02vw,14px);font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:#dbcfd4;animation:rise .7s both}
.kicker::before,.kicker::after{content:"";width:clamp(18px,2.4vw,34px);height:2px;background:linear-gradient(90deg,transparent,var(--red));opacity:.95}
.kicker::after{transform:rotate(180deg)}
.headline{margin:clamp(8px,1.6vh,16px) 0 clamp(6px,1.3vh,12px);font-family:"Arial Black","Segoe UI Black",Impact,"Segoe UI",Arial,sans-serif;font-size:clamp(60px,min(10.4vw,18vh),162px);font-weight:1000;letter-spacing:-.07em;line-height:.96;text-transform:uppercase;max-width:100%;white-space:nowrap;animation:rise 1s .1s both}
.headline span{display:inline-block;background:linear-gradient(180deg,#fff7f8 0%, #ffdce2 24%, #ff8799 54%, #ff3151 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 24px rgba(255,40,70,.16))}
.headline span::after{content:"";position:absolute}
.years{display:flex;align-items:center;gap:clamp(12px,1.8vw,28px);font-size:clamp(30px,min(4.3vw,7.5vh),68px);font-weight:1000;letter-spacing:-.04em;line-height:1;animation:rise 1s .2s both}
.years .arrow{color:var(--red);font-size:.7em;animation:nudge 1.8s ease-in-out infinite;text-shadow:0 0 14px rgba(255,48,81,.45)}
.tagline{margin-top:clamp(10px,1.6vh,16px);max-width:min(980px,88vw);font-size:clamp(13px,min(1.45vw,2.4vh),24px);line-height:1.36;color:var(--muted);font-weight:600;animation:rise 1s .3s both}
.tagline strong{display:block;color:var(--white);font-size:1.14em;font-weight:900;letter-spacing:-.01em;margin-bottom:4px}
.count-section{position:relative;z-index:5;flex:0 0 auto;padding-bottom:clamp(6px,1vh,10px);transform:translateY(-34px)}
.count-shell{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:clamp(16px,1.7vw,24px);background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02) 44%, rgba(255,35,65,.05));box-shadow:0 18px 55px rgba(0,0,0,.32);}
.count-shell::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg, transparent, var(--red), #ff99aa, var(--red), transparent);box-shadow:0 0 18px rgba(255,48,81,.45)}
.count-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(13px,2vh,19px) clamp(18px,2.3vw,34px) 0;font-size:clamp(10px,.92vw,13px);font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#e0d5d9}
.count-head .lead{display:flex;align-items:center;gap:10px;white-space:nowrap}
.count-head .lead .pulse{width:7px;height:7px;border-radius:50%;background:#ff4560;box-shadow:0 0 0 4px rgba(255,69,96,.12),0 0 14px rgba(255,69,96,.7);animation:pulse 2.4s infinite}
.count-head .date{font-size:clamp(9px,.82vw,12px);color:#b8adb3;letter-spacing:.10em;white-space:nowrap}
.digits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:clamp(12px,2.2vh,18px) 0 clamp(12px,2vh,18px)}
.digit{padding:0 clamp(8px,1.3vw,18px);text-align:center;min-width:0;position:relative}
.digit+.digit{border-left:1px solid rgba(255,255,255,.12)}
.value{display:block;font-family:"Arial Black","Segoe UI Black",Impact,"Segoe UI",Arial,sans-serif;font-size:clamp(52px,min(7.9vw,14.6vh),126px);line-height:.9;font-weight:1000;letter-spacing:-.06em;font-variant-numeric:tabular-nums;text-shadow:0 0 26px rgba(255,255,255,.07)}
.digit:last-child .value{color:#ff7087;text-shadow:0 0 30px rgba(255,48,81,.24)}
.value.tick{animation:tick .35s ease both}
.name{display:block;margin-top:clamp(6px,1.1vh,10px);font-size:clamp(10px,.9vw,13px);font-weight:900;letter-spacing:.20em;text-transform:uppercase;color:#b8aeb5}
.footer{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line-soft);padding-block:clamp(8px,1.3vh,12px);color:#a89ea6;font-size:clamp(9px,.84vw,12px);font-weight:800;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}
.footer strong{color:#f0e7ea}
.footer .spark{color:var(--red2);font-size:1.25em}
.celebration{display:none;position:absolute;inset:0;z-index:12;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center, rgba(100,8,28,.94), rgba(7,7,10,.96) 80%);pointer-events:none}
.celebration.visible{display:flex}
.celebration .over{font-size:clamp(12px,1.2vw,18px);font-weight:900;letter-spacing:.24em;color:#ffd9df;text-transform:uppercase}
.celebration h2{font-family:"Arial Black","Segoe UI Black",Impact,Arial,sans-serif;font-size:clamp(54px,min(10vw,20vh),170px);line-height:.9;letter-spacing:-.065em;margin:16px 0}
.celebration h2 em{font-style:normal;color:var(--red)}
.celebration p{font-size:clamp(15px,1.7vw,24px);color:#f2e1e5}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes breath{0%,100%{transform:translateX(-50%) scale(.985);opacity:.82}50%{transform:translateX(-50%) scale(1.04);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%,100%{opacity:.28;transform:translateX(-8%) rotate(22deg)}50%{opacity:.62;transform:translateX(8%) rotate(22deg)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes tick{0%{opacity:.45;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 4px rgba(255,69,96,.12),0 0 14px rgba(255,69,96,.7)}50%{opacity:.7;box-shadow:0 0 0 8px rgba(255,69,96,0),0 0 18px rgba(255,69,96,.8)}}
/* TV optimization */
@media (max-height:760px) {
  .brand-mark{width:52px;height:46px} .brand-title{font-size:13px} .brand-meta{font-size:8px}
  .header-note{font-size:9px}
  .headline{font-size:clamp(54px,min(10vw,17.5vh),148px);margin:6px 0}
  .years{font-size:clamp(27px,min(4vw,7vh),58px)}
  .tagline{font-size:clamp(12px,min(1.2vw,2.2vh),19px);margin-top:8px;max-width:min(860px,88vw)}
  .count-head{padding-top:10px} .value{font-size:clamp(47px,min(7.2vw,13.2vh),110px)} .name{margin-top:4px}
  .footer{padding-block:8px}
}
@media (max-height:440px) {
  .edge-frame{inset:8px}
  .header{padding-block:5px} .brand-mark{width:40px;height:34px} .brand-meta{display:none} .header-note{font-size:8px;gap:8px}
  .main{padding-block:2px;transform:translateY(-10px)} .kicker{font-size:8px;letter-spacing:.18em} .headline{font-size:min(10vw,16vh);margin:2px 0} .years{font-size:min(4vw,6.7vh)}
  .tagline{font-size:10px;line-height:1.24;max-width:78vw;margin-top:4px} .tagline strong{margin-bottom:2px}
  .count-section{padding-bottom:3px;transform:translateY(-18px)} .count-head{padding:7px 12px 0;font-size:8px} .count-head .date{font-size:7px} .value{font-size:min(7vw,12vh)} .name{font-size:8px;letter-spacing:.12em}
  .footer{padding-block:5px;font-size:7px}
}
@media (max-width:760px) {
  .header-note{display:none}
  .headline{font-size:min(14vw,13.4vh)}
  .years{font-size:min(8vw,5.8vh)}
  .tagline{font-size:clamp(11px,2.5vw,16px);max-width:92vw}
  .count-head .date{display:none}
  .value{font-size:clamp(42px,11vw,76px)}
  .name{font-size:9px;letter-spacing:.11em}
}
@media (max-width:520px) and (max-height:320px) {
  .brand-mark{width:28px;height:24px} .brand-title{font-size:9px} .header{padding-block:4px}
  .kicker{display:none} .headline{font-size:min(10vw,14.4vh)} .years{font-size:min(5vw,5vh)}
  .tagline{font-size:8px;line-height:1.18;margin-top:3px;max-width:82vw}
  .count-head{padding:5px 8px 0;font-size:7px} .digits{margin:6px 0} .digit{padding-inline:4px} .value{font-size:min(7vw,10vh)} .name{font-size:6px;margin-top:2px}
  .footer{padding-block:4px;font-size:6px} .footer span:last-child{display:none}
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* VERDANO TV / Frameless edition: no outer border, no bottom panel, no dividers. */
.edge-frame,.header-note,.footer {display:none!important}
.header {border-bottom:0;padding-top:clamp(14px,2.6vh,27px);padding-bottom:clamp(8px,1.4vh,18px)}
.count-section {padding-bottom:clamp(25px,5.8vh,64px)}
.count-shell {overflow:visible;background:none;border:none;border-radius:0;box-shadow:none;backdrop-filter:none}
.count-shell::before {display:none}
.count-head {justify-content:center;text-align:center;padding:0;margin:0}
.count-head .date {font-size:clamp(11px,1.12vw,16px);letter-spacing:.19em;font-weight:800;color:#d6c6ce}
.digits {gap:clamp(6px,1.9vw,32px);margin:clamp(16px,3vh,30px) 0 0;padding:0 clamp(4px,.5vw,10px)}
.digit,.digit+.digit {border:none!important;padding:0 clamp(3px,.45vw,10px)}
.value {font-size:clamp(56px,min(9vw,17vh),146px);line-height:1.02;letter-spacing:-.055em;text-shadow:0 8px 24px rgba(0,0,0,.3)}
.digit:last-child .value {color:#ff6680;text-shadow:0 0 38px rgba(255,48,81,.2)}
.name {font-size:clamp(11px,1.15vw,16px);letter-spacing:.16em;margin-top:clamp(8px,1.7vh,15px);color:#cdc0c7}
.main {padding-bottom:clamp(8px,1.8vh,20px)}
@media (max-height:760px) {
  .header {padding-top:10px;padding-bottom:6px}
  .count-section {padding-bottom:clamp(13px,3.5vh,30px)}
  .digits {margin-top:clamp(10px,2vh,18px)}
  .value {font-size:clamp(46px,min(8.3vw,15.5vh),114px)}
  .name {font-size:clamp(9px,.95vw,13px);margin-top:6px}
  .count-head .date {font-size:clamp(9px,.95vw,13px)}
}
@media (max-height:440px) {
  .header {padding-block:5px}
  .count-section {padding-bottom:8px}
  .digits {margin:6px 0 0;gap:4px;padding:0}
  .digit,.digit+.digit {padding:0 3px}
  .value {font-size:min(8vw,15.2vh)}
  .name {font-size:8px;letter-spacing:.12em;margin-top:3px}
  .count-head .date {font-size:8px;letter-spacing:.10em}
}
@media (max-width:650px) and (min-height:500px) {
  .digits {gap:4px}
  .value {font-size:min(10vw,9vh)}
  .name {font-size:9px}
}
@media (max-width:520px) and (max-height:320px) {
  .count-section {padding-bottom:7px}
  .digits {margin-top:4px}
  .value {font-size:min(8vw,13vh)}
  .name {font-size:6px;margin-top:2px}
  .count-head .date {font-size:7px}
}


/* IC-TV HIGH-CONTRAST EDITION: brighter on dark GTA TV textures, no boxes. */
:root { --white:#ffffff; --muted:#f1e2e7; --red:#ff3c62; --red2:#ff8399; }
body { background:#24151c; }
.app {
  background:
    radial-gradient(ellipse 62% 73% at 50% 42%, rgba(153,38,68,.43) 0%, rgba(93,24,46,.28) 54%, transparent 88%),
    radial-gradient(ellipse 37% 36% at 85% 20%, rgba(160,35,59,.20), transparent 78%),
    linear-gradient(180deg,#261a23 0%,#22151f 48%,#1b1722 100%);
}
.app::before { background:radial-gradient(ellipse at center,transparent 57%,rgba(0,0,0,.17) 100%); }
.stage-glow { border-color:rgba(255,124,149,.20); box-shadow:0 0 112px rgba(252,61,100,.17),inset 0 0 85px rgba(255,88,117,.08); }
.stage-glow::before,.stage-glow::after { border-color:rgba(255,155,172,.14); }
.light-sweep { background:linear-gradient(90deg,transparent 33%,rgba(255,90,127,.15) 50%,transparent 67%); }
.brand-mark { filter:brightness(1.45) contrast(1.09) saturate(1.2) drop-shadow(0 0 13px rgba(255,75,108,.42)); }
.brand-title { color:#fff; text-shadow:0 1px 10px rgba(255,255,255,.22); }
.brand-meta { color:#fff0f3; }
.kicker { color:#fff2f4; text-shadow:0 1px 10px rgba(255,255,255,.18); }
.headline span {
  background:linear-gradient(180deg,#ffffff 0%,#fff8f9 28%,#ffd1dc 67%,#ff7891 100%);
  -webkit-background-clip:text; background-clip:text;
  filter:drop-shadow(0 0 19px rgba(255,127,154,.43)) drop-shadow(0 0 45px rgba(255,76,114,.18));
}
.years { color:#ffffff; text-shadow:0 1px 24px rgba(255,255,255,.22); }
.years .arrow { color:#ff859c; text-shadow:0 0 13px rgba(255,103,138,.72); }
.count-head .date { color:#fff4f6; text-shadow:0 1px 9px rgba(255,255,255,.18); }
.value { color:#ffffff; text-shadow:0 0 18px rgba(255,255,255,.22),0 0 45px rgba(255,180,198,.10); }
.digit:last-child .value { color:#ffc4d0; text-shadow:0 0 23px rgba(255,153,176,.48),0 0 50px rgba(255,86,122,.18); }
.name { color:#ffeff3; text-shadow:0 1px 11px rgba(255,255,255,.25); }
.celebration { background:radial-gradient(ellipse at center,rgba(146,29,65,.96),rgba(27,13,23,.96) 80%); }
.celebration h2 em { color:#ffd0da; }
#fireworks { filter:brightness(1.45) saturate(1.15); }

</style>
</head>
<body>
<div class="app">
  <div class="stage-glow" aria-hidden="true"></div>
  <div class="light-sweep" aria-hidden="true"></div>
  <canvas id="fireworks" aria-hidden="true"></canvas>

      <div class="brand-copy">
        <div class="brand-title">VERDANO CITY</div>
        <div class="brand-meta">NEW YEAR'S EVE · 2026 / 2027</div>
      </div>
    </div>
  </header>

  <main class="main frame">
    <section class="hero">
      <div class="kicker">Verdano City präsentiert</div>
      <div class="headline"><span>SILVESTER</span></div>
      <div class="years"><span id="from-year">2026</span><span class="arrow">→</span><span id="to-year">2027</span></div>
      
    </section>
  </main>

  <section class="count-section frame" aria-label="Countdown bis zum neuen Jahr in Berlin">
    <div class="count-shell">
      <div class="count-head"><div class="date" id="target-date">01. Januar 2027 · 00:00 Uhr / Berlin · MEZ</div></div>
      <div class="digits" role="timer" aria-live="off">
        <div class="digit"><span class="value" id="days">000</span><span class="name">Tage</span></div>
        <div class="digit"><span class="value" id="hours">00</span><span class="name">Stunden</span></div>
        <div class="digit"><span class="value" id="minutes">00</span><span class="name">Minuten</span></div>
        <div class="digit"><span class="value" id="seconds">00</span><span class="name">Sekunden</span></div>
      </div>
    </div>
  </section>

  <div class="celebration" id="celebration">
    <div>
      <div class="over">Verdano City wünscht euch</div>
      <h2>FROHES <br><em>NEUES!</em></h2>
      <p>Willkommen in <span id="celebrate-year">2027</span>.</p>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const values = { days:$('days'), hours:$('hours'), minutes:$('minutes'), seconds:$('seconds') };
  const previous = { days:null, hours:null, minutes:null, seconds:null };
  let lastTargetYear = -1;
  let launched = false;
  const berlinYear = () => Number(new Intl.DateTimeFormat('en', { timeZone:'Europe/Berlin', year:'numeric' }).format(new Date()));
  const midnight = year => Date.UTC(year - 1, 11, 31, 23, 0, 0);

  function setValue(key, value) {
    const el = values[key], text = String(value);
    if (previous[key] !== text) {
      el.textContent = text;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
      previous[key] = text;
    }
  }

  function updateClock() {
    const now = Date.now();
    const year = berlinYear();
    const thisMidnight = midnight(year);
    const celebrate = now >= thisMidnight && now < thisMidnight + 10 * 60 * 1000;
    const targetYear = celebrate ? year : year + 1;

    if (targetYear !== lastTargetYear) {
      $('from-year').textContent = String(targetYear - 1);
      $('to-year').textContent = String(targetYear);
      $('target-date').textContent = `01. Januar ${targetYear} · 00:00 Uhr / Berlin · MEZ`;
      $('celebrate-year').textContent = String(targetYear);
      lastTargetYear = targetYear;
    }

    const total = celebrate ? 0 : Math.max(0, Math.floor((midnight(targetYear) - now) / 1000));
    setValue('days', String(Math.floor(total / 86400)).padStart(3,'0'));
    setValue('hours', String(Math.floor(total / 3600) % 24).padStart(2,'0'));
    setValue('minutes', String(Math.floor(total / 60) % 60).padStart(2,'0'));
    setValue('seconds', String(total % 60).padStart(2,'0'));

    $('celebration').classList.toggle('visible', celebrate);
    if (celebrate && !launched) { launched = true; boostFireworks(14000); }
    if (!celebrate) launched = false;
  }

  const canvas = $('fireworks');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let w=0,h=0,dpr=1,particles=[],running=false,boostUntil=0,lastBurst=0;

  function resize() {
    w = innerWidth; h = innerHeight; dpr = Math.min(devicePixelRatio||1,2);
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', resize, {passive:true}); resize();

  function addBurst(x, y, size = 1, palette = null) {
    const colors = palette || ['#ff3656','#ff6880','#ffb2bf','#ffe7eb','#ffffff','#ff9ca8'];
    const count = reduce.matches ? 18 : Math.round(40 * size);
    const base = 1.4 + Math.random()*1.2*size;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const speed = base + Math.random() * (2.2 * size);
      particles.push({
        x, y,
        vx: Math.cos(a)*speed,
        vy: Math.sin(a)*speed,
        life: 1,
        decay: .010 + Math.random()*.010,
        r: 1.2 + Math.random()*(2.8*size),
        color: colors[(Math.random()*colors.length)|0]
      });
    }
  }

  function scheduleAmbientBursts(t) {
    const big = t < boostUntil;
    const interval = big ? 280 : 640;
    if (t - lastBurst < interval) return;
    lastBurst = t;
    const side = Math.random();
    let x, y, size;
    if (side < .34) { x = w*(.10 + Math.random()*.16); y = h*(.20 + Math.random()*.34); size = big ? 1.6 : 1.25; }
    else if (side < .68) { x = w*(.74 + Math.random()*.16); y = h*(.16 + Math.random()*.34); size = big ? 1.7 : 1.28; }
    else { x = w*(.28 + Math.random()*.44); y = h*(.06 + Math.random()*.20); size = big ? 1.35 : 1.0; }
    addBurst(x, y, size);
  }

  function animate(t) {
    ctx.clearRect(0,0,w,h);
    scheduleAmbientBursts(t);
    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += .020; p.vx *= .992; p.life -= p.decay;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  function boostFireworks(ms=10000) { boostUntil = Math.max(boostUntil, performance.now() + ms); }

  updateClock();
  setInterval(updateClock, 250);
  if (!reduce.matches) boostFireworks(4000);
  requestAnimationFrame(animate);
})();
</script>
